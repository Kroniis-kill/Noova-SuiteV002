<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo_grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6A2CFF" />
      <stop offset="1" stop-color="#FF1493" />
    </linearGradient>
  </defs>
  <!-- Fondo ajustado: más pequeño (74x74) y centrado para dar margen -->
  <rect width="74" height="74" x="13" y="13" rx="18" fill="#0a0a0a" stroke="url(#logo_grad)" stroke-width="1.5"/>
  <!-- La "N" central escalada proporcionalmente para lucir más elegante -->
  <!-- Trazo Izquierdo -->
  <path d="M 34 62 V 38" stroke="white" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Diagonal -->
  <path d="M 34 38 L 66 62" stroke="url(#logo_grad)" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Trazo Derecho -->
  <path d="M 66 62 V 38" stroke="white" stroke-width="7.5" stroke-linecap="round"/>
</svg>