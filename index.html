    <!--
      El script de respaldo de Tailwind (cdn.tailwindcss.com) que vivía acá
      se eliminó: cargaba una SEGUNDA copia completa de Tailwind en tiempo
      de ejecución, con su propia paleta de colores duplicada (y en el caso
      de "accent", con un valor DISTINTO al real: #B621FF vs el
      brand-accent real #FF1493). Esto causaba que ~13 componentes de alta
      visibilidad (dashboard, resumen financiero, cuentas) dependieran por
      completo de este script externo para pintar sus colores, con riesgo
      real de romperse en silencio si el CDN fallaba o se bloqueaba, y de
      verse con una paleta ligeramente distinta al resto de la app.
      Todas esas dependencias ya se migraron a los tokens reales del
      sistema de diseño (tailwind.config.js) y se agregó un alias en ese
      mismo archivo para las clases shadow-glow/shadow-glow-sm, así que
      quitar este script no cambia el aspecto visual de la app — solo
      elimina la duplicación y el riesgo.
    -->
