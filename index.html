
<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />
    
    <!-- PWA Mobile Headers -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Noova" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <title>Noova</title>

    <!-- Fuentes: Inter (hasta peso 900) y Roboto Mono para datos técnicos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind (respaldo) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: "#0a0a0a",
              surface: "#1c1c1e",
              primary: "#6A2CFF",
              secondary: "#FF1493",
              accent: "#B621FF",
              success: "#10b981",
              danger: "#ef4444",
              warning: "#f59e0b",
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              mono: ["Roboto Mono", "monospace"],
            },
            boxShadow: {
              glow: "0 0 25px rgba(106, 44, 255, 0.25)",
              "glow-sm": "0 0 15px rgba(106, 44, 255, 0.20)",
              card: "0 20px 40px -10px rgba(0, 0, 0, 0.6)",
            },
          },
        },
      };
    </script>

    <!-- Estilos base -->
    <style>
      body {
        background-color: #0a0a0a;
        color: #ffffff;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6A2CFF;
      }
    </style>

    <!-- OneSignal SDK Loader -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
